name: remote-bridge
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: "default"
priority: "optional"
file_name_template: "{{ .Package }}-{{ .Version }}-{{ .Arch }}"
maintainer: "foxy82 <foxy82.githubl@gmail.com>"
description: |
  Remote to Network Bridge.
  Reads key events from an remote control and forwards
  them over UDP to a remote server. Monitors /dev/input for
  hotplug events and reconnects automatically.
license: MIT

contents:
  - src: remote_bridge
    dst: /usr/local/bin/remote_bridge
    file_info:
      mode: 0755

  - src: remote-bridge.initd
    dst: /etc/init.d/remote-bridge
    file_info:
      mode: 0755

  - src: 99-remote-bridge.rules
    dst: /etc/udev/rules.d/99-remote-bridge.rules
    file_info:
      mode: 0644

  - src: remote-bridge.conf
    dst: /etc/remote-bridge.conf
    type: config|noreplace
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall-apk.sh
  preremove: packaging/scripts/preremove-apk.sh

apk:
  signature:
    # Key location on the build worker
    key_file: "remote-bridge.rsa"

