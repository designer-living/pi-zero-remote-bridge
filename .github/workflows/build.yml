name: Build Check

on:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v6

    name: Build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/work" -w /work \
            alpine:latest \
            sh -c "apk add --no-cache make gcc musl-dev linux-headers basu-dev basu-static libcap-dev libcap-static pkgconf && \
                   make VERSION=${GITHUB_SHA::7} CFLAGS='-static -O3 -Wall -Wextra' && make test"

      - name: Keep the static binary
        uses: actions/upload-artifact@v7
        with:
          name: remote_bridge-${{ matrix.arch }}
          path: remote_bridge
          retention-days: 14
