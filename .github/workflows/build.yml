name: Build Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: armhf
            cc: arm-linux-gnueabihf-gcc
            cc_pkg: gcc-arm-linux-gnueabihf
            cflags: -march=armv6 -mfpu=vfp -mfloat-abi=hard
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            cc_pkg: gcc-aarch64-linux-gnu
            cflags: ""
          - arch: amd64
            cc: gcc
            cc_pkg: ""
            cflags: ""

    name: Build (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools
        if: matrix.cc_pkg != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc_pkg }}

      - name: Build
        run: ${{ matrix.cc }} ${{ matrix.cflags }} -O2 -Wall -Wextra -o remote_bridge remote_bridge.c
