name: Build and Release Packages

on:
  release:
    types: [created]

jobs:
  build-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: armhf
            use_qemu: true
          - arch: arm64
            use_qemu: false
            cc: aarch64-linux-gnu-gcc
            cc_pkg: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cflags: ""
          - arch: amd64
            use_qemu: false
            cc: gcc
            cc_pkg: ""
            cflags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      # armhf: build inside a QEMU-emulated arm/v6 Alpine container so the binary
      # is compiled with the correct ARMv6 toolchain (Ubuntu's cross-compiler targets
      # ARMv7 and produces binaries that segfault on Pi Zero v1).
      - name: Set up QEMU
        if: ${{ matrix.use_qemu }}
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build static binary (armhf via QEMU)
        if: ${{ matrix.use_qemu }}
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD:/work" -w /work \
            alpine:latest \
            sh -c "apk add --no-cache gcc musl-dev && gcc -static -O2 -Wall -Wextra -o remote_bridge remote_bridge.c"

      # arm64 / amd64: standard cross-compilation. Build statically so the same
      # binary works for both the .deb and .apk packages.
      - name: Install cross-compilation tools
        if: ${{ !matrix.use_qemu }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cc_pkg }}

      - name: Build static binary
        if: ${{ !matrix.use_qemu }}
        run: ${{ matrix.cc }} ${{ matrix.cflags }} -static -O2 -Wall -Wextra -o remote_bridge remote_bridge.c

      - name: Build Debian package
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: nfpm package --config packaging/nfpm-deb.yaml --packager deb --target .

      - name: Build Alpine package
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: nfpm package --config packaging/nfpm-apk.yaml --packager apk --target .

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.apk
