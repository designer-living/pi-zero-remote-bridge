name: Build and Release Packages

on:
  release:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v6

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static binary
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/work" -w /work \
            alpine:latest \
            sh -c "apk add --no-cache gcc musl-dev linux-headers && \
                   gcc -static -O2 -Wall -Wextra -o remote_bridge remote_bridge.c"

      - name: Build Debian package
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: nfpm package --config packaging/nfpm-deb.yaml --packager deb --target .

      - name: Build Alpine package
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: nfpm package --config packaging/nfpm-apk.yaml --packager apk --target .

      - name: Prepare binary for release
        run: mv remote_bridge remote_bridge-${{ steps.vars.outputs.VERSION }}-${{ matrix.arch }}

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.apk
            remote_bridge-${{ steps.vars.outputs.VERSION }}-${{ matrix.arch }}
