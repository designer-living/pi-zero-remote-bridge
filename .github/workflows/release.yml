name: Build and Release Packages

on:
  release:
    types: [created]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armhf
            platform: linux/arm/v6

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: vars
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install nfpm
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build static binary
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/work" -w /work \
            alpine:latest \
            sh -c "apk add --no-cache make gcc musl-dev linux-headers && \
                   make VERSION=${{ steps.vars.outputs.VERSION }} CFLAGS='-static -O3 -Wall -Wextra'"

      - name: Set up Signing Keys for nFPM
        run: |
          echo "${{ secrets.APK_PRIVATE_KEY }}" > remote-bridge.rsa
          echo "${{ secrets.APK_PUBLIC_KEY }}" > remote-bridge.rsa.pub
          chmod 600 remote-bridge.rsa


      - name: Build Debian package
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: nfpm package --config packaging/nfpm-deb.yaml --packager deb --target .

      - name: Build Alpine package (Signed natively by nFPM)
        env:
          VERSION: ${{ steps.vars.outputs.VERSION }}
          ARCH: ${{ matrix.arch }}
        run: nfpm package --config packaging/nfpm-apk.yaml --packager apk --target .

      - name: Prepare binary for release
        run: mv remote_bridge remote_bridge-${{ steps.vars.outputs.VERSION }}-${{ matrix.arch }}

      - name: Upload packages to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.deb
            *.apk
            remote_bridge-${{ steps.vars.outputs.VERSION }}-${{ matrix.arch }}

      - name: Upload APK artifact for repository indexing
        uses: actions/upload-artifact@v4
        with:
          name: apk-packages-${{ matrix.arch }}
          path: "*.apk"

  deploy-apk-repo:
    needs: build-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/packages
          pattern: apk-packages-*
          merge-multiple: true

      - name: Organize Architectures, Generate Indexes, and Prepare Site
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:latest /bin/sh -c "
            set -e
            apk add --no-cache apk-tools abuild
            cd dist

            # 1. Setup keys
            echo '${{ secrets.APK_PRIVATE_KEY }}' > remote-bridge.rsa
            echo '${{ secrets.APK_PUBLIC_KEY }}' > remote-bridge.rsa.pub
            chmod 600 remote-bridge.rsa

            # 2. Create architecture folders
            mkdir -p armhf aarch64 x86_64

            # 3. Move packages into arch folders
            mv packages/*armhf*.apk armhf/ 2>/dev/null || true
            mv packages/*aarch64*.apk aarch64/ 2>/dev/null || true
            mv packages/*x86_64*.apk x86_64/ 2>/dev/null || true

            KEY_PATH=\"\$(pwd)/remote-bridge.rsa\"

            # 4. Standardize filenames, index, and sign each architecture directory
            for ARCH in armhf aarch64 x86_64; do
              if [ -d \"\$ARCH\" ] && [ \$(ls -A \"\$ARCH\") ]; then
                cd \"\$ARCH\"
                
                # Inspect local file header (-W) to get full package name and version
                for FILE in *.apk; do
                  if [ -f \"\$FILE\" ] && [ \"\$FILE\" != \"APKINDEX.tar.gz\" ]; then
                    PKG_NAME=\$(apk info --allow-untrusted -W \"\$FILE\" | head -n1 | awk '{print \$1}')
                    if [ -n \"\$PKG_NAME\" ]; then
                      mv \"\$FILE\" \"\${PKG_NAME}.apk\"
                    fi
                  fi
                done

                apk index --allow-untrusted -o APKINDEX.tar.gz *.apk
                abuild-sign -k \"\$KEY_PATH\" APKINDEX.tar.gz
                cd ..
              fi
            done

            # 5. Clean up temporary files
            touch .nojekyll
            rm -rf packages remote-bridge.rsa
          "



      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist


