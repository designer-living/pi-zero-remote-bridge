# Remote Bridge Configuration
# Copy this to /etc/remote-bridge.conf and edit as needed

# Log level: ERROR, INFO, DEBUG, TRACE
LOG_LEVEL="INFO"
# Send the KEY DOWN / KEY UP packet this many times. KEY HOLD is still only sent once.
EDGE_REPEAT_COUNT=1

# Remotes configuration
# Format: REMOTE=<exact_remote_name>,<server_ip>,<server_port>[,<device_id_substring>]
#
# The optional 4th field is only needed to tell apart two remotes that
# report the SAME name. It is matched as a substring of EITHER:
#   - the device's physical location:  cat /sys/class/input/eventX/device/phys
#     (USB: bus/port path, stable per port across reboots/reconnects)
#   - the device's unique id:          cat /sys/class/input/eventX/device/uniq
#     (Bluetooth: the remote's own address)

REMOTE="IR-receiver,192.168.1.100,9999"
# REMOTE="Another-Remote,192.168.1.101,9999"
# Two identical USB remotes, routed by port:
# REMOTE="Sony Remote,192.168.1.100,9999,usb-3f980000.usb-1.2"
# REMOTE="Sony Remote,192.168.1.101,9999,usb-3f980000.usb-1.3"
# Two identical Bluetooth remotes, routed by the remote's address:
# REMOTE="Sony Remote,192.168.1.100,9999,e4:e0:c5:11:22:33"
# REMOTE="Sony Remote,192.168.1.101,9999,e4:e0:c5:44:55:66"
