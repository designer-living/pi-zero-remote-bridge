# Remote Bridge Configuration
# Copy this to /etc/remote-bridge.conf and edit as needed

# Log level: ERROR, INFO, DEBUG, TRACE
LOG_LEVEL="INFO"

# Remotes configuration
# Format: REMOTE=<exact_remote_name>,<server_ip>,<server_port>,[repeat_delay_ms]
# repeat_delay_ms is optional (default 0). It throttles repeat events (value=2) to every X ms.

REMOTE="IR-receiver,192.168.1.100,9999,0"
# REMOTE="Another-Remote,192.168.1.101,9999,100"
