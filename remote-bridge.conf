# Remote Bridge Configuration
# Copy this to /etc/remote-bridge.conf and edit as needed

# The exact name of your remote device as shown in evtest
# To find it, run: evtest
REMOTE_NAME="IR-receiver"

# Server IP address to send events to
SERVER_IP="192.168.1.100"

# Server port
SERVER_PORT="9999"

# Log level: ERROR, INFO, DEBUG, TRACE
LOG_LEVEL="INFO"

# Throttles repeat events (value=2) to every X ms (0 = disabled)
REPEAT_DELAY_MS="0"
